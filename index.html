<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<title>Morning Briefing</title>
<style>
html,body{margin:0;padding:0;background:var(--rootBg,#080a14);font-family:'Space Grotesk',"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
*{box-sizing:border-box}
input,button,a,select,textarea{font-family:inherit}
input:focus,button:focus{outline:1px solid var(--acc);outline-offset:2px}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--accBd);border-radius:2px}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-3%) scale(1.12)}}
@keyframes halo{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ── 폰 모드: 할 일 + 수행평가만 ── */
body.phone{overflow:auto}
body.phone #root{position:static;display:block;height:auto;overflow:visible}
body.phone #stage{width:100%;height:auto;min-height:100dvh;transform:none!important;
  display:flex;flex-direction:column;gap:12px;padding:16px 14px 24px}
body.phone #b1,body.phone #b2{width:420px;height:340px;filter:blur(70px)}
body.phone header{flex-wrap:wrap;gap:10px}
body.phone .greet{font-size:15px}
body.phone #anchorLabel,body.phone #countdown,body.phone #modeBtn,body.phone #previewBtn{display:none}
body.phone main{display:flex;flex-direction:column;gap:12px}
body.phone #clockCard,body.phone #wxCard,body.phone #quoteCard,
body.phone #fortuneCard,body.phone #sleepCard,body.phone #lionsCard,
body.phone footer{display:none}
body.phone section.col{display:contents}
body.phone #todoCard{flex:none;min-height:340px}
body.phone #todoList{max-height:44dvh}
body.phone.showall #clockCard,body.phone.showall #wxCard,body.phone.showall #quoteCard,
body.phone.showall #fortuneCard,body.phone.showall #sleepCard,body.phone.showall #lionsCard,
body.phone.showall footer{display:flex}
body.phone.showall #lionsCard,body.phone.showall #quoteCard{display:block}

#root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--rootBg);transition:background .6s}
#stage{position:relative;width:1440px;height:900px;flex:none;padding:20px 24px 18px;display:grid;grid-template-rows:auto 1fr auto;gap:14px;background:var(--bg);color:var(--tx);overflow:hidden;transform-origin:center center;transition:background .6s,color .6s}
.blob{position:absolute;border-radius:50%;filter:blur(54px);pointer-events:none}
#b1{width:860px;height:660px;left:-210px;top:-250px;background:var(--blob1);animation:drift 18s ease-in-out infinite}
#b2{width:800px;height:640px;right:-190px;bottom:-270px;background:var(--blob2);animation:drift 22s ease-in-out infinite reverse}

header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brandwrap{display:flex;align-items:center;gap:14px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.brand{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--tx3)}
.greet{font-size:17px;color:var(--tx)}
.hactions{display:flex;align-items:center;gap:9px}
.pill{padding:7px 14px;border-radius:999px;background:var(--chip);border:1px solid var(--bd);font-size:12px;color:var(--tx2);cursor:pointer}
.pill.acc{background:var(--accSoft);border-color:var(--accBd);color:var(--acc);cursor:default}

main{position:relative;display:grid;grid-template-columns:1.24fr 1.02fr 1.06fr;gap:14px;min-height:0}
section.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.card{border-radius:22px;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(22px);animation:rise .5s ease both}
.lab{font-size:10px;letter-spacing:.26em;color:var(--tx3)}
.rowb{display:flex;align-items:center;justify-content:space-between}
.mini{font-size:11px;color:var(--tx3)}

#clockCard{flex:0 0 auto;padding:20px 26px 18px}
.ctop{display:flex;align-items:baseline;gap:14px}
.hhmm{font-weight:300;font-size:92px;line-height:.84;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ampm{font-size:15px;color:var(--tx3)}
.ss{margin-left:auto;font-size:14px;color:var(--tx3);font-variant-numeric:tabular-nums}
.cbot{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:12px}
.datefull{font-size:17px;color:var(--tx2)}
.ddchips{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.ddchip{padding:5px 12px;border-radius:999px;font-size:12px}

#wxCard{flex:1 1 auto;min-height:0;padding:18px 24px;display:flex;flex-direction:column}
.wxmain{margin-top:10px;display:flex;align-items:center;gap:20px}
.wxicon{font-size:52px;line-height:1;color:var(--acc)}
.wxtemp{font-weight:300;font-size:68px;line-height:.88}
.wxcol{display:flex;flex-direction:column;gap:2px}
.wxdesc{font-size:21px}
.wxsub{font-size:14px;color:var(--tx2);white-space:nowrap}
.wxstats{margin-top:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.wxstat{padding:9px 11px;border-radius:12px;background:var(--chip);display:flex;flex-direction:column;gap:2px}
.wxstat i{font-size:10px;letter-spacing:.14em;color:var(--tx3);font-style:normal}
.wxstat b{font-size:16px;font-weight:400}
.wxadvice{margin:12px 0 0;font-size:14px;line-height:1.55;color:var(--acc)}
.hourly{margin-top:auto;padding-top:12px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:6px}
.hcell{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.hcell .t{font-size:11px;color:var(--tx3)}
.hcell .i{font-size:15px;color:var(--acc)}
.hcell .v{font-size:15px}

#quoteCard{flex:0 0 auto;padding:15px 24px;background:var(--cardSoft)}
#quoteText{margin:0;font-size:16px;line-height:1.5}
#quoteAuthor{display:block;margin-top:5px;font-size:11px;letter-spacing:.16em;color:var(--tx3)}

#todoCard{flex:1 1 auto;min-height:0;padding:18px 22px;display:flex;flex-direction:column}
.todoadd{margin-top:11px;display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:12px;border:1px dashed var(--bd2);background:var(--chip)}
.todoadd span{color:var(--acc);font-size:14px}
.todoadd input{flex:1;background:transparent;border:none;font-size:15px;color:var(--tx)}
#todoList{margin-top:9px;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.todo{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;background:var(--cardSoft)}
.todo.done{background:var(--chip)}
.todo .ck{width:17px;height:17px;flex:none;padding:0;border-radius:50%;border:1.5px solid var(--bd2);background:transparent;cursor:pointer}
.todo.done .ck{border-color:var(--acc);background:var(--acc)}
.todo .tx{flex:1;font-size:15px;line-height:1.35}
.todo.done .tx{color:var(--tx3);text-decoration:line-through}
.todo .rm{background:transparent;border:none;color:var(--tx3);font-size:16px;cursor:pointer;padding:0 2px}

#taskCard{flex:0 0 auto;padding:18px 22px;border-radius:22px;border:1px solid var(--violetBd);background:var(--violet);backdrop-filter:blur(22px);animation:rise .5s .16s ease both}
#taskList{margin-top:11px;display:flex;flex-direction:column;gap:9px}
.task{display:flex;align-items:center;gap:12px}
.task .d{padding:5px 11px;border-radius:9px;font-size:13px;min-width:52px;text-align:center}
.task .m{flex:1;display:flex;flex-direction:column}
.task .m b{font-size:15px;font-weight:400}
.task .m i{font-size:11px;color:var(--tx3);font-style:normal}
.task .rm{background:transparent;border:none;color:var(--tx3);font-size:15px;cursor:pointer}
.tinybtn{padding:4px 11px;border-radius:999px;background:var(--chip);border:1px solid var(--bd);font-size:11px;color:var(--tx2);cursor:pointer}

#fortuneCard{flex:1 1 auto;min-height:0;padding:18px 22px;border-radius:22px;border:1px solid var(--accBd);background:var(--cardAcc);backdrop-filter:blur(22px);display:flex;flex-direction:column;animation:rise .5s .2s ease both}
.fscore{margin-top:10px;display:flex;align-items:baseline;gap:14px}
.fscore b{font-weight:300;font-size:72px;line-height:.85;font-variant-numeric:tabular-nums}
.fscore i{font-size:22px;color:var(--tx2);font-style:normal}
#fHeadline{margin:13px 0 0;font-size:16px;line-height:1.6}
#fBadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#fBadges span{font-size:11.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--bd);color:var(--tx2)}
#fBadges span.good{border-color:var(--accBd);background:var(--accSoft);color:var(--acc)}
#fBadges span.warn{border-color:var(--violetBd);background:var(--violet);color:var(--violetTx)}
#fAct{margin-top:14px;padding-top:13px;border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#fAct div{display:flex;flex-direction:column;gap:4px}
#fAct i{font-size:10px;letter-spacing:.12em;color:var(--tx3);font-style:normal}
#fAct b{font-size:14px;font-weight:400}
#fBars{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.fbar{display:flex;align-items:center;gap:9px}
.fbar span{width:30px;font-size:12px;color:var(--tx2)}
.fbar .tr{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.fbar .fl{height:100%;border-radius:3px;background:var(--barFill)}
.fbar b{width:22px;text-align:right;font-size:12px;color:var(--tx2);font-weight:400;font-variant-numeric:tabular-nums}
#fLucky{margin-top:auto;padding-top:12px;border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#fLucky div{display:flex;flex-direction:column;gap:3px}
#fLucky i{font-size:10px;letter-spacing:.12em;color:var(--tx3);font-style:normal}
#fLucky b{font-size:15px;color:var(--acc);font-weight:400}

#sleepCard{flex:0 0 auto;padding:16px 22px}
.slnum{margin-top:8px;display:flex;align-items:baseline;gap:12px}
.slnum b{font-weight:300;font-size:46px;line-height:.9}
.slnum i{font-size:14px;color:var(--tx2);font-style:normal}
#sleepBars{margin-top:10px;display:flex;align-items:flex-end;gap:6px;height:30px}
#sleepBars div{flex:1;border-radius:4px;background:var(--barIdle)}
#sleepBars div.today{background:var(--acc)}
#sleepInsight{display:block;margin-top:7px;font-size:12px;color:var(--tx2)}
#sleepEmpty{display:none}
#sleepAsk{margin:10px 0 0;font-size:14px;line-height:1.5;color:var(--tx2)}
.sleepact{margin-top:10px;display:flex;gap:7px;align-items:center}
.mibtn{padding:9px 14px;border-radius:11px;border:1px solid var(--accBd);background:var(--accSoft);font-size:13px;color:var(--acc);white-space:nowrap}
.sleepact input{width:74px;padding:9px 10px;border-radius:11px;border:1px solid var(--bd2);background:var(--chip);font-size:14px;color:var(--tx);text-align:center}
.sleepact button{padding:9px 14px;border-radius:11px;border:1px solid var(--bd2);background:var(--chip);font-size:13px;color:var(--tx2);cursor:pointer}
#sleepRange{width:100%;margin-top:6px;accent-color:var(--acc)}

#lionsCard{flex:0 0 auto;padding:16px 22px;border-radius:22px;border:1px solid var(--blueBd);background:var(--blue);backdrop-filter:blur(22px);display:block;animation:rise .5s .28s ease both}
#lionsHeadline{margin-top:8px;font-size:24px}
#lionsChips{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
#lionsRecent{margin-top:11px;padding-top:10px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
#lionsRecent .hd{font-size:10px;letter-spacing:.14em;color:var(--tx3)}
#lionsRecent .g{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2)}
#lionsRecent .g b{font-weight:600;font-variant-numeric:tabular-nums}
#lionsRecent .w{color:var(--acc)}
#lionsRecent .l{color:var(--violetTx)}
#lionsRecent .d{color:var(--tx3)}
.lchip{padding:5px 11px;border-radius:999px;background:var(--chip);font-size:12px;color:var(--tx2)}
.lchip.acc{background:var(--accSoft);color:var(--acc)}

footer{position:relative;padding:14px 0 13px;border-radius:22px;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(22px);display:flex;flex-direction:column;gap:11px;animation:rise .5s .32s ease both}
.newshead{display:flex;align-items:baseline;gap:12px;padding:0 20px}
.newshead b{font-size:11px;letter-spacing:.24em;color:var(--acc);font-weight:400}
.newshead button{padding:0;background:transparent;border:none;font-size:11px;color:var(--tx3);cursor:pointer;text-align:left}
/* 본문 3열과 같은 트랙 — 세로선이 위 카드 경계와 맞음 */
#newsList{display:grid;grid-template-columns:1.24fr 1.02fr 1.06fr;gap:14px;margin:0 -1px}
#newsList a{display:flex;flex-direction:column;gap:5px;padding-left:19px;border-left:2px solid var(--accBd)}
#newsList .tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:2.8em}
#newsList .tag{font-size:11px;letter-spacing:.18em;color:var(--acc)}
#newsList .tt{font-size:17px;line-height:1.4;color:var(--tx)}

.overlay{position:absolute;inset:0;z-index:40;background:var(--scrim);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
#setBox{width:720px;max-height:800px;overflow-y:auto;padding:26px 28px;border-radius:24px;border:1px solid var(--bd);background:var(--modal)}
#setBox .ttl{display:flex;align-items:center;justify-content:space-between}
#setBox .ttl span{font-size:22px}
#setBox .ttl button{background:transparent;border:none;font-size:22px;color:var(--tx3);cursor:pointer}
.fields{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fields label{display:flex;flex-direction:column;gap:6px}
.fields label span{font-size:11px;letter-spacing:.14em;color:var(--acc)}
.fields input,.fields select{padding:10px 12px;border-radius:11px;border:1px solid var(--bd2);background:var(--chip);font-size:14px;color:var(--tx)}
.setbtns{margin-top:16px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.setbtns button{padding:9px 16px;border-radius:999px;font-size:13px;cursor:pointer}
.bt-blue{border:1px solid var(--blueBd);background:var(--blue);color:var(--blueTx)}
.bt-violet{border:1px solid var(--violetBd);background:var(--violet);color:var(--violetTx)}
.bt-acc{border:1px solid var(--accBd);background:var(--accSoft);color:var(--acc)}
#ddayEdit{margin-top:14px;display:flex;flex-direction:column;gap:7px}
#ddayEdit div{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:12px;background:var(--chip)}
#ddayEdit b{flex:1;font-size:14px;font-weight:400}
#ddayEdit i{font-size:13px;color:var(--tx2);font-style:normal}
#ddayEdit button{background:transparent;border:none;color:var(--tx3);font-size:15px;cursor:pointer}
.setnote{margin:16px 0 0;font-size:12px;line-height:1.6;color:var(--tx3)}
.setclose{margin-top:18px;display:flex;justify-content:flex-end}
.setclose button{padding:11px 24px;border-radius:999px;border:1px solid var(--accBd);background:var(--accSoft);font-size:14px;color:var(--acc);cursor:pointer}

#alarm{position:absolute;inset:0;z-index:60;background:var(--alarmBg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#alarm.show{display:flex}
#halo{position:absolute;width:540px;height:540px;border-radius:50%;border:1px solid var(--accBd);animation:halo 2.6s ease-in-out infinite}
.awrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.awrap .wu{font-size:11px;letter-spacing:.4em;color:var(--acc)}
.awrap .tm{font-weight:300;font-size:92px;line-height:1;font-variant-numeric:tabular-nums}
.awrap .ms{font-size:17px;color:var(--tx2)}
#missionArea{position:relative;min-height:200px;display:flex;align-items:center;justify-content:center}
.mathrow{display:flex;gap:16px}
.mathq{width:172px;padding:16px 18px;border-radius:16px;border:1px solid var(--bd2);background:var(--card);display:flex;flex-direction:column;gap:10px}
.mathq span{font-size:24px;text-align:center}
.mathq input{padding:9px;border-radius:10px;border:1px solid var(--bd2);background:var(--chip);font-size:20px;text-align:center;color:var(--tx)}
.mathq input.ok{border-color:var(--accBd)}
.mathq input.no{border-color:#d97a5e}
.briefwrap{display:flex;flex-direction:column;gap:14px;width:640px}
.briefq{padding:14px 18px;border-radius:16px;border:1px solid var(--bd2);background:var(--card)}
.briefq>span{font-size:16px}
.briefopts{margin-top:10px;display:flex;gap:8px}
.briefopts button{flex:1;padding:9px 8px;border-radius:11px;border:1px solid var(--bd2);background:var(--chip);font-size:14px;color:var(--tx);cursor:pointer}
.briefopts button.sel{border-color:var(--accBd);background:var(--accSoft)}
.patwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.patwrap .hint{font-size:14px;color:var(--tx2)}
.patgrid{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.patgrid button{height:72px;border-radius:18px;border:1px solid var(--bd2);background:var(--chip);font-size:22px;color:var(--tx);cursor:pointer}
.patgrid button.on{border-color:var(--accBd);background:var(--accSoft);color:var(--acc)}
.typewrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:660px}
.typewrap .tg{font-size:22px;text-align:center}
.typewrap input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--bd2);background:var(--chip);font-size:19px;text-align:center;color:var(--tx)}
.typewrap input.ok{border-color:var(--accBd)}
.typewrap input.no{border-color:#d97a5e}
.swipewrap{display:flex;flex-direction:column;align-items:center;gap:16px;width:620px}
.swipewrap input{width:100%;accent-color:var(--acc);height:34px}
.swipewrap .pc{font-size:34px;font-weight:300;color:var(--acc)}
.abtns{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px}
#dismissBtn{padding:14px 44px;border-radius:999px;border:1px solid var(--accBd);background:var(--accSoft);font-size:16px;letter-spacing:.08em;color:var(--acc);cursor:pointer}
#alarmFeedback{font-size:13px;color:var(--tx2);min-height:18px}
#snoozeBtn{background:transparent;border:none;font-size:12px;letter-spacing:.14em;color:var(--tx3);cursor:pointer}
</style>
</head>
<body>
<div id="root">
  <div id="stage">
    <div class="blob" id="b1"></div><div class="blob" id="b2"></div>

    <header>
      <div class="brandwrap">
        <span class="dot"></span>
        <span class="brand" id="brandLabel">Morning Briefing</span>
        <span class="greet" id="greeting"></span>
      </div>
      <div class="hactions">
        <span class="pill" id="anchorLabel" style="cursor:default"></span>
        <span class="pill acc" id="countdown"></span>
        <button class="pill" id="modeBtn"></button>
        <button class="pill" id="previewBtn">기상 미션</button>
        <button class="pill" id="allBtn" style="display:none">전체 보기</button>
        <button class="pill" id="setBtn">설정</button>
      </div>
    </header>

    <main>
      <section class="col">
        <div class="card" id="clockCard">
          <div class="ctop">
            <span class="hhmm" id="hhmm">00:00</span>
            <span class="ampm" id="ampm">AM</span>
            <span class="ss" id="ss">00</span>
          </div>
          <div class="cbot">
            <span class="datefull" id="dateFull"></span>
            <div class="ddchips" id="ddayChips"></div>
          </div>
        </div>

        <a class="card" id="wxCard" href="https://weather.naver.com/today/09470102" id="wxLink" target="_blank" rel="noopener">
          <div class="rowb"><span class="lab" id="wxLabel">SEOUL · 오늘 날씨</span><span class="mini" id="wxSource">불러오는 중 · 네이버 날씨 ↗</span></div>
          <div class="wx
